<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="#ffffff!important">

    <meta
      name="description"
      content="Markfy App"
    />

    <link rel="icon" href="%PUBLIC_URL%/logo-markfy.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-markfy.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Markfy</title>

    <!--
      TEMA — aplicado ANTES do primeiro paint.

      Roda de forma síncrona, antes do React e antes do CSS
      pintar qualquer coisa. Sem isso a tela nasceria clara
      e piscaria para escura quando o JavaScript carregasse.

      Lê o cookie `markfy_theme` (com localStorage de
      reserva). Sem escolha registrada, não escreve atributo
      nenhum e o CSS segue o sistema operacional sozinho,
      via @media (prefers-color-scheme).
    -->
    <script>
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)markfy_theme=([^;]*)/);
          var t = m ? decodeURIComponent(m[1]) : null;

          if (t !== "light" && t !== "dark" && t !== "system") {
            try { t = localStorage.getItem("markfy-theme"); } catch (e) { t = null; }
          }

          if (t !== "light" && t !== "dark" && t !== "system") {
            t = "system";
          }

          var root = document.documentElement;

          if (t === "system") {
            root.removeAttribute("data-theme");
          } else {
            root.setAttribute("data-theme", t);
          }

          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          if (dark) {
            root.classList.add("dark-mode");

            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#111214");
          }
        } catch (e) {
          /* Sem tema salvo, o CSS segue o sistema. */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
<div id="modal-root"></div>

  </body>
</html>
